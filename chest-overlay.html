<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overlay coffre</title>
<style>
  :root{
    --fg: #e6e6e6;
    --muted: #999999;
    --accent: #ffffff;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0;
    width:100%; height:100%;
    background:transparent;
    color:var(--fg);
    font-family:'Segoe UI', sans-serif;
    overflow:hidden;
  }

  .stage{
    position:fixed; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }

  /* ---------------------------- Coffre (sprites Seliel the Shaper) ---------------------------- */
  .chest-wrap{
    position:relative;
    width:192px; height:192px;
    opacity:0;
    transform:scale(0.9);
    transition:opacity 0.3s ease, transform 0.3s ease;
  }
  .chest-wrap.visible{ opacity:1; transform:scale(1); }

  .chest-sprite{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
  }

  /* Coffre visible mais pas encore ouvert : un evenement est en attente
     que le streamer clique "Ouvrir le coffre" dans chest-control.html. */
  .chest-wrap.idle-bob{ animation: idle-bob 2.4s ease-in-out infinite; }
  @keyframes idle-bob{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-6px); }
  }

  .chest-wrap.shaking{ animation: chest-shake 0.12s infinite; }
  @keyframes chest-shake{
    0%{ transform: translateX(0) rotate(0); }
    25%{ transform: translateX(-4px) rotate(-1.5deg); }
    50%{ transform: translateX(3px) rotate(1deg); }
    75%{ transform: translateX(-3px) rotate(-1deg); }
    100%{ transform: translateX(0) rotate(0); }
  }

  /* Pas de sprite de fissure dans le pack (seulement ferme/ouvert) : la
     montee en tension se joue via des a-coups + flashs successifs. */
  .chest-wrap.pulse{ animation: chest-pulse 0.35s ease; }
  @keyframes chest-pulse{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.12) rotate(-2deg); }
    100%{ transform:scale(1); }
  }
  .impact-flash{
    position:absolute; left:50%; top:45%;
    width:140px; height:140px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.9), rgba(255,255,255,0) 70%);
    opacity:0;
    pointer-events:none;
  }
  .impact-flash.flash{ animation: impact-flash-anim 0.35s ease-out; }
  @keyframes impact-flash-anim{
    0%{ opacity:0.9; transform:translate(-50%,-50%) scale(0.6); }
    100%{ opacity:0; transform:translate(-50%,-50%) scale(1.4); }
  }

  .burst{
    position:absolute; left:50%; top:45%;
    width:10px; height:10px;
    transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.95), rgba(255,255,255,0) 70%);
    opacity:0;
    pointer-events:none;
  }
  .chest-wrap.bursting .burst{
    animation: burst-pop 0.7s ease-out forwards;
  }
  @keyframes burst-pop{
    0%{ width:10px; height:10px; opacity:1; }
    100%{ width:420px; height:420px; opacity:0; }
  }

  /* Flash blanc plein ecran a l'instant precis de l'ouverture (frame 4 +
     classe .bursting, voir la fin de playOpening) - au-dessus de tout le
     reste (dernier enfant de .stage). */
  .open-flash{
    position:absolute; inset:0;
    background:#fff;
    opacity:0;
    pointer-events:none;
  }
  .open-flash.flash{ animation: open-flash-anim 0.4s ease-out; }
  @keyframes open-flash-anim{
    0%{ opacity:0.95; }
    100%{ opacity:0; }
  }


  /* ---------------------------- Feu d'artifice (flipbook 8 frames) ---------------------------- */
  .firework{
    position:absolute; left:50%; top:38%;
    width:160px; height:160px;
    transform:translate(-50%,-50%);
    image-rendering:pixelated;
    object-fit:contain;
    opacity:0;
    pointer-events:none;
    filter:grayscale(1); /* l'asset source (Fireworks, OpenGameArt) est en couleur */
  }
  .firework.playing{ opacity:1; }

  /* ---------------------------- Jaillissement d'items (coffre ouvert) ---------------------------- */
  /* Rayons de lumiere + items qui montent depuis le coffre, façon "chest opening"
     Vampire Survivors - remplace l'ancienne machine a sous encadree. */
  .burst-wrap{
    position:absolute; inset:0;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.3s ease;
  }
  .burst-wrap.visible{ opacity:1; }

  /* Rayons CSS (clip-path). La forme de chaque trapeze ET son point d'ancrage
     (left/top) reprennent tels quels les coordonnees mesurees dans les 3
     croquis originaux du streamer (apex + lignes laterales/basses, sur leur
     canevas source 700x700 - chest-wrap fait 192x192, un carre comme le
     canevas, donc les fractions x/700 et y/700 se reportent directement en
     % du conteneur, exactement comme le faisait avant l'ancienne version en
     <img> avec object-fit:contain). Seule la hauteur est etendue vers le
     haut et refermee par un bord plat au lieu d'etre coupee par le bord de
     l'image. Visibles seulement pendant .chest-wrap.bursting. */
  .chest-ray{
    position:absolute;
    transform-origin:50% 100%;
    filter:blur(1px);
    opacity:0;
    pointer-events:none;
  }
  .chest-wrap.bursting .chest-ray{ animation: ray-pulse 1.4s ease-in-out infinite; }
  /* Pendant le jaillissement (playOngoing), les 3 rayons alternent un par un
     au lieu d'etre tous affiches en meme temps (voir cycleRays) - retire au
     debut de la revelation, ou les 3 restent affiches ensemble. */
  .chest-wrap.bursting.cycling .chest-ray{ animation:none; opacity:0; }
  .chest-wrap.bursting.cycling .chest-ray.ray-active{ animation: ray-pulse 1.4s ease-in-out infinite; }
  /* Apex a (302,397)/700 - cf. light-ray-1.png. Decalage/rotation individuels
     reglables depuis chest-control.html (--ray1-offset-x/y/--ray1-rotation,
     voir applySettings). La rotation pivote autour de l'apex, comme
     transform-origin est 50% 100% - donc apres le translate qui place ce
     point sur l'ancrage left/top. */
  .chest-ray-1{
    left:calc(43.1% + var(--ray1-offset-x, 0%)); top:calc(56.7% + var(--ray1-offset-y, 0%));
    width:70vh; height:70vh;
    transform:translate(-50%, -100%) rotate(var(--ray1-rotation, 0deg));
    clip-path: polygon(48% 100%, 52% 100%, 72.4% 0%, 6.9% 0%);
    background:linear-gradient(0deg, rgba(210,210,210,0.9), rgba(210,210,210,0.08));
  }
  /* Apex a (360,460)/700 - cf. light-ray-2.png. */
  .chest-ray-2{
    left:calc(51.4% + var(--ray2-offset-x, 0%)); top:calc(65.7% + var(--ray2-offset-y, 0%));
    width:119vh; height:70vh;
    transform:translate(-50%, -100%) rotate(var(--ray2-rotation, 0deg));
    clip-path: polygon(48% 100%, 52% 100%, 92.5% 0%, 49.4% 0%);
    background:linear-gradient(0deg, rgba(210,210,210,0.9), rgba(210,210,210,0.08));
    animation-delay:0.2s;
  }
  /* Apex a (104,397)/700 - cf. light-ray-3.png. */
  .chest-ray-3{
    left:calc(14.9% + var(--ray3-offset-x, 0%)); top:calc(56.7% + var(--ray3-offset-y, 0%));
    width:101.5vh; height:70vh;
    transform:translate(-50%, -100%) rotate(var(--ray3-rotation, 0deg));
    clip-path: polygon(48% 100%, 52% 100%, 75% 0%, 25% 0%);
    background:linear-gradient(0deg, rgba(210,210,210,0.9), rgba(210,210,210,0.08));
    animation-delay:0.4s;
  }
  @keyframes ray-pulse{
    0%, 100%{ opacity:0.65; }
    50%{ opacity:0.95; }
  }

  .floating-icon{
    position:absolute; left:var(--fx-origin-x, 50%); bottom:var(--fx-origin-y, 50%);
    width:28px; height:28px;
    transform:translate(-50%, 0);
    animation: float-up 1.4s ease-out forwards;
  }
  @keyframes float-up{
    0%{ transform:translate(-50%, 0) scale(0.8); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translate(calc(-50% + var(--drift, 0px)), -60vh) scale(1); opacity:0; }
  }

  /* Fontaines a pieces (positions/nombre configurables - voir SETTINGS.coinFountains
     et l'onglet "Pieces" de chest-control.html), dans .chest-wrap donc
     ancrees pareil que .chest-sprite/.chest-ray. Trajectoire parabolique :
     resserree pres du coffre (faible variance sur --fly-peak-x), puis
     s'elargit vers le bas (forte variance sur --fly-x, tire au hasard par
     piece dans spawnFountainCoin). L'animation est creee dynamiquement en
     JS (Web Animations API, voir spawnFountainCoin) plutot qu'en @keyframes
     CSS statique, car la position du pic de la parabole et le debut du
     fondu doivent pouvoir varier avec les reglages. */
  .coin-fountain{
    position:absolute;
    object-fit:contain;
    opacity:0;
    pointer-events:none;
  }

  /* Foule d'avatars dansants - palier epique uniquement. Une piece de
     fontaine a 20% de chances de jaillir sous forme d'avatar (voir
     spawnFountainCoin) ; a la fin de son vol, un avatar permanent est
     ajoute ici (spawnCrowdAvatar), devant le coffre. Toutes les instances
     (celles en vol ET celles de la foule) partagent la meme horloge de
     frame (registerDanceElement) pour danser en synchro. */
  .avatar-crowd{
    position:absolute; inset:0;
    pointer-events:none;
  }
  .avatar-crowd-member{
    position:absolute;
    object-fit:contain;
    transform:translate(-50%, -50%);
    pointer-events:none;
  }
  /* A la revelation (voir triggerCrowdCelebration) : un saut synchronise
     (meme animation, meme instant pour tous) suivi d'un sautillement
     continu mais asynchrone (duree/delai randomises par avatar via
     --hop-duration/--hop-delay) jusqu'a la fermeture du coffre. */
  .avatar-crowd-member.jumping{ animation: avatar-jump 0.5s ease-out 1; }
  @keyframes avatar-jump{
    0%{ transform:translate(-50%, -50%) translateY(0); }
    35%{ transform:translate(-50%, -50%) translateY(-26px); }
    60%{ transform:translate(-50%, -50%) translateY(0); }
    100%{ transform:translate(-50%, -50%) translateY(0); }
  }
  .avatar-crowd-member.hopping{
    animation-name: avatar-hop;
    animation-timing-function: ease-in-out;
    animation-iteration-count: infinite;
    animation-duration: var(--hop-duration, 0.6s);
    animation-delay: var(--hop-delay, 0s);
  }
  @keyframes avatar-hop{
    0%, 100%{ transform:translate(-50%, -50%) translateY(0); }
    50%{ transform:translate(-50%, -50%) translateY(-10px); }
  }

  /* ---------------------------- Carte de recompense (fallback sans video) ----------------------------
     Meme habillage "encre" que les messages de twitch-chat-ink.html (brush
     peinte en fond + texte cursive au contour noir simule par text-shadow -
     voir applyRewardCardBrush) - positionnee au-dessus du coffre (meme
     point d'ancrage fx-origin-x/y qu'utilisaient les rayons/la pluie
     d'objets, decalee de -180px). */
  .reward-card{
    position:absolute; inset:0;
    opacity:0;
    transition:opacity 0.4s ease;
    pointer-events:none;
  }
  .reward-card.visible{ opacity:1; }
  .reward-card-inner{
    position:absolute;
    left:var(--fx-origin-x, 50%); bottom:var(--fx-origin-y, 50%);
    transform:translate(-50%, -180px);
  }
  .reward-card-content{
    position:relative; z-index:1;
    display:flex; flex-direction:column; align-items:center;
    padding:16px 14px;
  }
  .reward-card-brush{
    position:absolute;
    z-index:0;
    background-size:100% 100%;
    background-repeat:no-repeat;
    background-position:center;
    opacity:0;
    transform:scale(0.85);
    transition:opacity 0.25s ease, transform 0.25s ease;
  }
  .reward-card.visible .reward-card-brush{ opacity:1; transform:scale(1); }
  .reward-card-icon{ width:52px; height:52px; margin-bottom:2px; filter:drop-shadow(0 2px 3px rgba(0,0,0,0.6)); }
  /* Avatar Twitch du viewer recompense (voir renderRewardCardAvatar) - pris
     dans avatar_customizations (meme systeme que twitch-chat-ink.html) si
     ce viewer en a un, sinon un avatar fixe deduit du hash de son login
     (pickFallbackAvatar). Affiche a la place de .reward-card-icon quand
     disponible ; l'icone de palier reste le filet de secours si Supabase
     n'est pas joignable. */
  .reward-card-avatar{
    position:relative;
    width:64px; height:64px;
    margin-bottom:2px;
    filter:drop-shadow(0 2px 3px rgba(0,0,0,0.6));
    display:none;
  }
  .reward-card-avatar.visible{ display:block; }
  .reward-card-avatar img{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
  }
  .reward-card-tier,
  .reward-card-login{
    font-family:'Segoe Print', 'Bradley Hand', 'Chalkboard SE', 'Comic Sans MS', cursive;
    color:white;
    text-shadow:
      -2px -2px 0 black,  2px -2px 0 black,
      -2px  2px 0 black,  2px  2px 0 black,
      -2px  0   0 black,  2px  0   0 black,
       0   -2px 0 black,  0    2px 0 black,
       0 0 6px black;
  }
  .reward-card-tier{
    text-transform:uppercase;
    letter-spacing:0.05em;
    font-weight:700;
    font-size:15px;
  }
  .reward-card-login{ font-weight:700; font-size:22px; }

  .reward-video{
    position:absolute; inset:0;
    width:100%; height:100%;
    object-fit:contain;
    opacity:0;
    transition:opacity 0.4s ease;
  }
  .reward-video.visible{ opacity:1; }

  /* ---------------------------- Panneau de test (?debug=1 uniquement) ---------------------------- */
  .debug-panel{
    display:none;
    flex-direction:column;
    position:fixed; left:12px; top:12px;
    z-index:10;
    background:rgba(17,17,17,0.9);
    border:1px solid rgba(255,255,255,0.25);
    border-radius:10px;
    padding:10px;
    gap:8px;
    pointer-events:auto;
    max-width:420px;
  }
  .debug-panel.visible{ display:flex; }
  .debug-panel-row{ display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .debug-panel-label{
    font-family:inherit; font-size:11px; font-weight:600;
    color:rgba(255,255,255,0.5); text-transform:uppercase; letter-spacing:0.05em;
  }
  .debug-panel button{
    font-family:inherit;
    font-size:12px;
    font-weight:600;
    color:#000;
    background:var(--accent);
    border:none;
    border-radius:6px;
    padding:6px 10px;
    cursor:pointer;
  }
  .debug-panel button:hover{ filter:brightness(0.9); }
  .debug-panel button.secondary{ background:transparent; color:var(--accent); border:1px solid var(--accent); }
  .debug-panel button.active{ outline:2px solid #fff; outline-offset:1px; }
</style>
</head>
<body>

<div class="debug-panel" id="debug-panel">
  <div class="debug-panel-row">
    <span class="debug-panel-label">Animation complete</span>
  </div>
  <div class="debug-panel-row">
    <button data-test="follow">Test follow</button>
    <button data-test="sub:1000">Test sub T1</button>
    <button data-test="sub:2000">Test sub T2</button>
    <button data-test="sub:3000">Test sub T3</button>
    <button id="debug-close-btn">Fermer le coffre</button>
  </div>
  <div class="debug-panel-row">
    <span class="debug-panel-label">Forcer une etape (reste figee, pas d'auto-suite)</span>
  </div>
  <div class="debug-panel-row" id="debug-force-row">
    <button class="secondary" data-force="idle">Ferme</button>
    <button class="secondary" data-force="shaking">Secousses</button>
    <button class="secondary" data-force="bursting">Jaillissement</button>
    <button class="secondary" data-force="reveal">Revelation</button>
  </div>
</div>

<div class="stage">
  <div class="chest-wrap" id="chest-wrap">
    <div class="impact-flash" id="impact-flash"></div>
    <div class="burst"></div>
    <img class="chest-sprite" id="chest-sprite" alt="">
    <div class="chest-ray chest-ray-1" id="chest-ray-1"></div>
    <div class="chest-ray chest-ray-2" id="chest-ray-2"></div>
    <div class="chest-ray chest-ray-3" id="chest-ray-3"></div>
    <div class="avatar-crowd" id="avatar-crowd"></div>
  </div>

  <img class="firework" id="firework" alt="">

  <div class="burst-wrap" id="burst-wrap">
  </div>

  <div class="reward-card" id="reward-card">
    <div class="reward-card-inner">
      <div class="reward-card-brush" id="reward-card-brush"></div>
      <div class="reward-card-content" id="reward-card-content">
        <div class="reward-card-avatar" id="reward-card-avatar"></div>
        <img class="reward-card-icon" id="reward-card-icon" alt="">
        <div class="reward-card-tier" id="reward-card-tier">Epique</div>
        <div class="reward-card-login" id="reward-card-login">pseudo</div>
      </div>
    </div>
  </div>

  <video class="reward-video" id="reward-video" muted playsinline></video>

  <div class="open-flash" id="open-flash"></div>
</div>

<script src="assets/chest-manifest.js"></script>
<script src="assets/parts-manifest.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
(function(){

  /* ====================== CONFIG A REMPLIR ====================== */
  const CONFIG = {
    SUPABASE_URL: 'https://nvqddjwfzuusvmfwilyh.supabase.co',
    SUPABASE_ANON_KEY: 'sb_publishable_z9m2o_qjOP5Evrn_sR8uOw_vgeSIywz',
    // Sons optionnels : si absents/404, le flux visuel continue avec des
    // delais de secours (voir playTrack). A deposer dans assets/chest/audio/.
    AUDIO: {
      waiting: 'assets/chest/audio/waiting.mp3',
      opening: 'assets/chest/audio/opening.mp3',
      ongoing: {
        commun: 'assets/chest/audio/ongoing-commun.mp3',
        rare: 'assets/chest/audio/ongoing-rare.mp3',
        epique: 'assets/chest/audio/ongoing-epique.mp3',
      },
      ending: {
        commun: 'assets/chest/audio/ending-commun.mp3',
        rare: 'assets/chest/audio/ending-rare.mp3',
        epique: 'assets/chest/audio/ending-epique.mp3',
      },
    },
  };
  /* ================================================================ */

  const manifest = window.CHEST_MANIFEST;
  const sb = (CONFIG.SUPABASE_URL !== 'REMPLACE_MOI')
    ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY)
    : null;

  const chestWrap = document.getElementById('chest-wrap');
  const chestSprite = document.getElementById('chest-sprite');
  const impactFlash = document.getElementById('impact-flash');
  const openFlash = document.getElementById('open-flash');
  const firework = document.getElementById('firework');
  const burstWrap = document.getElementById('burst-wrap');
  const chestRayEls = [1, 2, 3].map((n) => document.getElementById(`chest-ray-${n}`));
  const avatarCrowdEl = document.getElementById('avatar-crowd');
  const rewardCard = document.getElementById('reward-card');
  const rewardCardIcon = document.getElementById('reward-card-icon');
  const rewardCardAvatar = document.getElementById('reward-card-avatar');
  const rewardCardTier = document.getElementById('reward-card-tier');
  const rewardCardLogin = document.getElementById('reward-card-login');
  const rewardCardBrush = document.getElementById('reward-card-brush');
  const rewardCardContent = document.getElementById('reward-card-content');
  const rewardVideo = document.getElementById('reward-video');

  const sleep = (ms) => new Promise(r => setTimeout(r, ms));

  function normalizeReward(rt){
    return manifest.rewardOrder.includes(rt) ? rt : 'commun';
  }

  // ---------------------------- Autoplay bloque par le navigateur ----------------------------

  // Un navigateur normal (teste en dehors d'OBS, ex. onglet Chrome ouvert
  // directement sur cette page) refuse l'autoplay avec son tant qu'aucune
  // interaction n'a eu lieu sur la page - ce qui arrive typiquement quand la
  // page se charge alors qu'un coffre est deja en file : le premier
  // audio.play() (boucle d'attente) est rejete silencieusement, sans son ni
  // erreur visible. Des qu'une interaction survient (clic, touche...), on
  // retente la lecture de tout ce qui est encore en pause. Dans OBS (source
  // navigateur), l'autoplay avec son est autorise par defaut : ce mecanisme
  // ne sert alors a rien mais ne genera pas non plus.
  const activeAudios = new Set();
  let autoplayUnlockArmed = false;

  function armAutoplayUnlock(){
    if(autoplayUnlockArmed) return;
    autoplayUnlockArmed = true;
    const retryAll = () => {
      activeAudios.forEach((audio) => {
        if(audio.paused && !audio.ended) audio.play().catch(() => {});
      });
    };
    document.addEventListener('pointerdown', retryAll, { passive: true });
    document.addEventListener('keydown', retryAll);
  }

  function attemptPlay(audio){
    activeAudios.add(audio);
    applyVolume(audio);
    audio.addEventListener('ended', () => activeAudios.delete(audio), { once: true });
    armAutoplayUnlock();
    audio.play().catch((err) => {
      console.warn('[chest-overlay] lecture audio bloquee (autoplay) - sera retentee a la premiere interaction sur la page:', err);
    });
  }

  // A appeler chaque fois qu'on met en pause une piste volontairement (elle
  // ne doit pas etre relancee plus tard par le mecanisme de deblocage
  // autoplay au prochain clic).
  function forgetAudio(audio){
    activeAudios.delete(audio);
  }

  // Meme prechargee, une piste a toujours un petit delai de demarrage reel
  // au moment du .play() (quelques dizaines de ms, incompressible). Pour que
  // la coupure soit imperceptible, la piste suivante demarre volontairement
  // un peu AVANT la fin reelle de la precedente plutot qu'exactement a la
  // fin : les deux se chevauchent legerement le temps que la nouvelle piste
  // soit vraiment audible, au lieu de laisser un blanc.
  //
  // Ajustable en direct depuis le panneau "Reglages audio" de
  // chest-control.html (table chest_settings, voir loadSettings/
  // subscribeSettingsRealtime plus bas) - ces valeurs par defaut ne servent
  // que tant que Supabase n'est pas configure ou pas encore charge.
  // opening.mp3 et waiting.mp3 sont les memes fichiers quel que soit le
  // palier - ces deux chevauchements restent uniques. ongoing/ending
  // dependent du palier (longueur, attaque... differentes), d'ou une valeur
  // par palier pour ces deux transitions.
  const SETTINGS = {
    waitingLoopOverlapMs: 200,
    waitingOpeningOverlapMs: 200,
    openingOngoingOverlapMs: { commun: 200, rare: 200, epique: 200 },
    ongoingEndingOverlapMs: { commun: 200, rare: 200, epique: 200 },
    volume: 1, // 0..1 - voir volume_percent (0-100) cote base/UI
    // Fontaines a pieces - voir spawnFountainCoin/startCoinFountain.
    coinOpacity: 0.9,        // 0..1
    coinVisibleFraction: 0.45, // 0..1 - part du vol a l'opacite max avant le fondu
    coinSpeedScale: 1,       // multiplie la vitesse (duree = base / vitesse)
    coinSizeVariation: 0.4,  // 0..1
    coinSpriteSpeedScale: 1, // multiplie la vitesse du flipbook
    // Positions actives (%, gauche/haut) + hauteur/largeur de parabole
    // individuelles - defaut = cote gauche/droit, arc par defaut (100%).
    coinFountains: [
      { x: 6, y: 62, arcHeightScale: 1, arcWidthScale: 1 },
      { x: 94, y: 62, arcHeightScale: 1, arcWidthScale: 1 },
    ],
  };

  // Applique le volume courant a une piste (appelee a la creation ET a
  // chaque changement de reglage pour les pistes deja en cours de lecture).
  function applyVolume(audio){
    audio.volume = SETTINGS.volume;
  }

  function applySettings(row){
    if(!row) return;
    if(Number.isFinite(row.waiting_loop_overlap_ms)) SETTINGS.waitingLoopOverlapMs = row.waiting_loop_overlap_ms;
    if(Number.isFinite(row.waiting_opening_overlap_ms)) SETTINGS.waitingOpeningOverlapMs = row.waiting_opening_overlap_ms;
    for(const tier of manifest.rewardOrder){
      const openKey = 'opening_ongoing_overlap_ms_' + tier;
      if(Number.isFinite(row[openKey])) SETTINGS.openingOngoingOverlapMs[tier] = row[openKey];
      const endKey = 'ongoing_ending_overlap_ms_' + tier;
      if(Number.isFinite(row[endKey])) SETTINGS.ongoingEndingOverlapMs[tier] = row[endKey];
    }
    if(Number.isFinite(row.volume_percent)){
      SETTINGS.volume = Math.max(0, Math.min(100, row.volume_percent)) / 100;
      activeAudios.forEach(applyVolume); // effet immediat sur ce qui joue deja
    }
    // Position du point d'origine des rayons/pluie d'objets/icone de
    // recompense - appliquee via une variable CSS, donc effet immediat meme
    // si le coffre est deja affiche (aucun besoin de relancer l'animation).
    if(Number.isFinite(row.effect_origin_x_percent)){
      document.documentElement.style.setProperty('--fx-origin-x', row.effect_origin_x_percent + '%');
    }
    if(Number.isFinite(row.effect_origin_y_percent)){
      document.documentElement.style.setProperty('--fx-origin-y', row.effect_origin_y_percent + '%');
    }
    // Decalage/rotation individuels par rayon (voir .chest-ray-1/2/3), pour
    // corriger leur position/angle un par un en direct sans toucher au code
    // - meme principe que --fx-origin-x/y ci-dessus.
    for(const n of [1, 2, 3]){
      const x = row[`ray${n}_offset_x_percent`];
      const y = row[`ray${n}_offset_y_percent`];
      const rot = row[`ray${n}_rotation_deg`];
      if(Number.isFinite(x)) document.documentElement.style.setProperty(`--ray${n}-offset-x`, x + '%');
      if(Number.isFinite(y)) document.documentElement.style.setProperty(`--ray${n}-offset-y`, y + '%');
      if(Number.isFinite(rot)) document.documentElement.style.setProperty(`--ray${n}-rotation`, rot + 'deg');
    }

    // Fontaines a pieces (voir spawnFountainCoin) - pris en compte des le
    // prochain coin genere, aucune animation en cours n'a besoin d'etre
    // relancee.
    if(Number.isFinite(row.coin_opacity_percent)) SETTINGS.coinOpacity = row.coin_opacity_percent / 100;
    if(Number.isFinite(row.coin_visible_percent)) SETTINGS.coinVisibleFraction = row.coin_visible_percent / 100;
    if(Number.isFinite(row.coin_speed_percent)) SETTINGS.coinSpeedScale = row.coin_speed_percent / 100;
    if(Number.isFinite(row.coin_size_variation_percent)) SETTINGS.coinSizeVariation = row.coin_size_variation_percent / 100;
    if(Number.isFinite(row.coin_sprite_speed_percent)) SETTINGS.coinSpriteSpeedScale = row.coin_sprite_speed_percent / 100;
    if(Number.isFinite(row.coin_fountain_count)){
      const count = Math.max(1, Math.min(4, row.coin_fountain_count));
      const fountains = [];
      for(let n = 1; n <= count; n++){
        const x = row[`fountain${n}_x_percent`];
        const y = row[`fountain${n}_y_percent`];
        const arcHeight = row[`fountain${n}_arc_height_percent`];
        const arcWidth = row[`fountain${n}_arc_width_percent`];
        if(Number.isFinite(x) && Number.isFinite(y)){
          fountains.push({
            x, y,
            arcHeightScale: Number.isFinite(arcHeight) ? arcHeight / 100 : 1,
            arcWidthScale: Number.isFinite(arcWidth) ? arcWidth / 100 : 1,
          });
        }
      }
      if(fountains.length > 0) SETTINGS.coinFountains = fountains;
    }
  }

  async function loadSettings(){
    if(!sb) return;
    const { data, error } = await sb.from('chest_settings').select('*').eq('id', 1).maybeSingle();
    if(error){ console.error('[chest-overlay] chargement reglages:', error); return; }
    applySettings(data);
  }

  function subscribeSettingsRealtime(){
    if(!sb) return;
    sb.channel('chest_settings_overlay')
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chest_settings' }, (payload) => {
        applySettings(payload.new);
      })
      .subscribe();
  }

  // Cree l'element audio et lance son chargement tout de suite, sans le
  // jouer - a appeler en avance (pendant qu'une phase precedente joue
  // encore) pour que le fichier soit deja pret au moment de playTrack().
  // Sans ca, le fetch/decodage du fichier demarre seulement quand on appelle
  // .play(), ce qui cree un blanc audible a chaque transition.
  function preloadTrack(src){
    const audio = new Audio(src);
    audio.preload = 'auto';
    audio.load();
    return audio;
  }

  // Joue une piste et fournit une promesse qui se resout legerement AVANT
  // la fin reelle (voir `overlapMs`) - sert d'horloge maitresse pour
  // enchainer la phase suivante en chevauchement plutot qu'avec un blanc.
  // `fallbackMs` n'est qu'un filet de securite si le fichier est absent/404
  // ou l'autoplay bloque - des que sa vraie duree est connue, le delai se
  // recalcule dessus.
  function playTrack(srcOrAudio, { loop = false, fallbackMs = 8000, overlapMs = 200 } = {}){
    const audio = (srcOrAudio instanceof HTMLAudioElement) ? srcOrAudio : new Audio(srcOrAudio);
    audio.loop = loop;
    let done = null;
    if(!loop){
      done = new Promise((resolve) => {
        let settled = false;
        let timer = null;
        const finish = () => {
          if(settled) return;
          settled = true;
          if(timer) clearTimeout(timer);
          resolve();
        };
        const arm = (ms) => { if(timer) clearTimeout(timer); timer = setTimeout(finish, Math.max(0, ms)); };
        const armFromDuration = () => arm(audio.duration * 1000 - overlapMs);
        arm(fallbackMs);
        // Si la piste a ete prechargee (preloadTrack), les metadonnees sont
        // deja chargees a ce stade et l'evenement 'loadedmetadata' ne se
        // redeclenchera pas - il faut donc aussi verifier l'etat courant,
        // pas seulement ecouter l'evenement.
        if(audio.readyState >= HTMLMediaElement.HAVE_METADATA && isFinite(audio.duration) && audio.duration > 0){
          armFromDuration();
        }else{
          audio.addEventListener('loadedmetadata', () => {
            if(isFinite(audio.duration)) armFromDuration();
          });
        }
        // Filet de secours si jamais le chevauchement volontaire ne se
        // declenchait pas (duree inconnue) : la vraie fin de piste reste un
        // deuxieme point de sortie possible.
        audio.addEventListener('ended', finish, { once: true });
        audio.addEventListener('error', finish, { once: true });
      });
    }
    attemptPlay(audio);
    return { audio, done };
  }

  // ---------------------------- File d'attente (coffre visible avant ouverture) ----------------------------

  // Evenements 'pending' connus (deja crees par twitch-eventsub, pas encore
  // declenches par le streamer). Le premier de la liste est celui affiche a
  // l'ecran - c'est aussi toujours celui que open-chest declenchera en
  // premier (meme tri "plus ancien d'abord" cote serveur).
  let pendingList = [];
  let waitingController = null;
  let animating = false;

  // Boucle waiting.mp3 en s'auto-chevauchant (meme principe que le
  // chevauchement entre les phases) : audio.loop natif recree une toute
  // petite coupure a chaque tour (surtout en MP3), donc on gere le bouclage
  // nous-memes en prechargeant/demarrant le tour suivant un peu avant la fin
  // du tour courant.
  function startWaitingLoop(src){
    let stopRequested = false;
    let hardStopped = false;
    let resolveStopped = null;
    const stopped = new Promise((resolve) => { resolveStopped = resolve; });
    let currentAudio = null;
    let boundaryTimer = null;

    // Programme (ou reprogramme) le point de sortie du tour en cours sur un
    // chevauchement donne, par rapport a la duree reelle de `audio` ET au
    // temps deja ecoule (requestStop() peut rearmer ceci en plein milieu
    // d'un tour, pas seulement au tout debut).
    function scheduleBoundary(audio, overlapMs, onBoundary){
      if(boundaryTimer) clearTimeout(boundaryTimer);
      const ms = Math.max(0, (audio.duration * 1000) - overlapMs - (audio.currentTime * 1000));
      boundaryTimer = setTimeout(onBoundary, ms);
    }

    function playSegment(){
      if(hardStopped) return;
      const audio = preloadTrack(src);
      currentAudio = audio;
      attemptPlay(audio);

      const arm = () => {
        if(hardStopped) return;
        // Chevauchement "boucle sur elle-meme" par defaut - requestStop()
        // reprogramme immediatement sur le chevauchement "attente -> ouverture"
        // des qu'il est appele, quel que soit le moment du tour en cours.
        scheduleBoundary(audio, SETTINGS.waitingLoopOverlapMs, () => {
          if(hardStopped) return;
          if(stopRequested){ resolveStopped(); return; }
          playSegment();
        });
      };
      if(audio.readyState >= HTMLMediaElement.HAVE_METADATA && isFinite(audio.duration) && audio.duration > 0){
        arm();
      }else{
        audio.addEventListener('loadedmetadata', arm, { once: true });
      }
    }

    playSegment();

    return {
      // Termine le tour de boucle en cours (pas de coupure en plein milieu)
      // puis se resout - a utiliser quand le streamer declenche l'ouverture.
      // Reprogramme tout de suite le point de sortie sur le chevauchement
      // dedie "attente -> ouverture" plutot que d'attendre le prochain point
      // de bouclage normal (qui utilise un chevauchement different).
      requestStop(){
        stopRequested = true;
        if(currentAudio && isFinite(currentAudio.duration) && currentAudio.duration > 0){
          scheduleBoundary(currentAudio, SETTINGS.waitingOpeningOverlapMs, () => {
            if(!hardStopped) resolveStopped();
          });
        }
        return stopped;
      },
      // Coupe immediatement, sans attendre la fin du tour (ex. l'evenement
      // disparait de la file sans jamais avoir ete declenche).
      stop(){
        hardStopped = true;
        stopRequested = true;
        if(boundaryTimer) clearTimeout(boundaryTimer);
        if(currentAudio){ currentAudio.pause(); forgetAudio(currentAudio); }
        resolveStopped();
      },
    };
  }

  function showWaitingChest(ev){
    chestSprite.src = manifest.chestFrames[0]; // ferme
    chestWrap.classList.remove('bursting');
    chestWrap.classList.add('visible', 'idle-bob');
    if(!waitingController){
      waitingController = startWaitingLoop(CONFIG.AUDIO.waiting);
    }
  }

  function hideChest(){
    chestWrap.classList.remove('visible', 'idle-bob', 'bursting');
    if(waitingController){ waitingController.stop(); waitingController = null; }
  }

  // Rafraichit l'affichage "en attente" d'apres pendingList - jamais pendant
  // qu'une ouverture est deja en cours (l'animation gere elle-meme sa suite).
  function refreshWaitingDisplay(){
    if(animating) return;
    if(pendingList.length > 0) showWaitingChest(pendingList[0]);
    else hideChest();
  }

  // Le coffre ouvert + la recompense restent affiches indefiniment apres la
  // phase de revelation, jusqu'a ce que le streamer clique "Fermer le
  // coffre" sur chest-control.html (ou le bouton du panneau ?debug=1). Une
  // seule ouverture est jamais affichee a la fois (traitement sequentiel de
  // la file), donc un seul resolveur actif suffit.
  let activeCloseResolve = null;

  function waitForClose(){
    return new Promise((resolve) => { activeCloseResolve = resolve; });
  }

  function forceClose(){
    if(activeCloseResolve){
      const resolve = activeCloseResolve;
      activeCloseResolve = null;
      resolve();
    }
  }

  const queue = [];
  let processing = false;

  function enqueueEvent(ev){
    queue.push(ev);
    processQueue();
  }

  async function processQueue(){
    if(processing) return;
    processing = true;
    animating = true;
    while(queue.length > 0){
      const ev = queue.shift();
      pendingList = pendingList.filter((p) => p.id !== ev.id);
      try{
        await playChestSequence(ev);
      }catch(err){
        console.error('[chest-overlay] erreur pendant l\'animation:', err);
      }
    }
    animating = false;
    processing = false;
    refreshWaitingDisplay(); // enchaine sur le prochain coffre en attente, s'il y en a un
  }

  async function playChestSequence(ev){
    const reward = normalizeReward(ev.reward_type);

    // Le coffre est normalement deja visible depuis l'etat d'attente ; on
    // s'assure juste que le sprite ferme est en place (utile si l'overlay a
    // rechargé sans etre passe par cet etat, ex. mode ?simulate=/?debug=1).
    chestSprite.src = manifest.chestFrames[0];
    chestWrap.classList.remove('bursting', 'idle-bob');
    chestWrap.classList.add('visible');
    resetAvatarCrowd(); // repart d'une foule vide pour ce nouveau tirage
    resetRewardCardAvatar();
    // Lance la recherche de l'avatar du viewer des maintenant (login connu
    // tout de suite) : elle a ainsi toute la duree de l'ouverture/du
    // jaillissement pour repondre, plutot que d'ajouter un temps d'attente
    // pile au moment de la revelation.
    const avatarPromise = prefetchRewardAvatar(ev.twitch_login);

    // Precharge les 3 pistes tout de suite (pendant que la boucle d'attente
    // termine son tour) : chacune a ainsi toute la duree necessaire pour
    // finir de charger, et playTrack() n'a plus qu'a appeler .play() sur un
    // fichier deja pret (plus de blanc du au fetch/decodage a chaque
    // transition).
    const openingAudio = preloadTrack(CONFIG.AUDIO.opening);
    const ongoingAudio = preloadTrack(CONFIG.AUDIO.ongoing[reward]);
    const endingAudio = preloadTrack(CONFIG.AUDIO.ending[reward]);

    // Laisse le tour de boucle "en attente" en cours se terminer
    // naturellement (pas de coupure en plein milieu) avant d'enchainer sur
    // l'ouverture - le chevauchement de fin de tour masque la transition.
    if(waitingController){
      await waitingController.requestStop();
      waitingController = null;
    }

    await playOpening(reward, openingAudio);
    await playOngoing(reward, ongoingAudio);
    await playEnding(ev, reward, endingAudio, avatarPromise);

    chestWrap.classList.remove('visible', 'bursting');
  }

  // --- Phase 1 : montee en tension + explosion, calee sur opening.mp3 ---
  async function playOpening(reward, preloadedAudio){
    const { done } = playTrack(preloadedAudio, { fallbackMs: 6500, overlapMs: SETTINGS.openingOngoingOverlapMs[reward] });

    chestWrap.classList.add('shaking');
    await sleep(900);
    chestWrap.classList.remove('shaking');

    // Secousses/flashs inchanges : la tension se joue en a-coups qui
    // s'enchainent jusqu'a la fin du morceau. Le coffre reste sur la frame 1
    // (ferme) durant toute cette phase - la frame 4 (grand ouvert) n'est
    // posee qu'au tout dernier moment, pour correspondre exactement au
    // debut de ongoing-<palier>.mp3, qui demarre juste apres le retour de
    // cette fonction.
    let trackEnded = false;
    done.then(() => { trackEnded = true; });
    while(!trackEnded){
      chestWrap.classList.remove('pulse');
      impactFlash.classList.remove('flash');
      void chestWrap.offsetWidth; // relance les animations CSS
      chestWrap.classList.add('pulse');
      impactFlash.classList.add('flash');
      await sleep(450);
    }

    chestSprite.src = manifest.chestFrames[3]; // grand ouvert
    chestWrap.classList.add('bursting'); // flash radial (voir .burst), en parallele de la suite
    triggerOpenFlash();
  }

  // Alterne l'affichage entre les 3 rayons (un seul visible a la fois, en
  // boucle 1 -> 2 -> 3) au lieu des 3 en meme temps - utilise pendant le
  // jaillissement. stopRayCycleFn est garde au niveau module pour que
  // forceStopEverything() puisse couper une boucle laissee en cours (ex.
  // bouton debug clique en plein jaillissement).
  let stopRayCycleFn = null;
  function startRayCycle(intervalMs = 500){
    chestWrap.classList.add('cycling');
    let activeIdx = 0;
    const applyActive = () => {
      chestRayEls.forEach((el, i) => el.classList.toggle('ray-active', i === activeIdx));
    };
    applyActive();
    const timer = setInterval(() => {
      activeIdx = (activeIdx + 1) % chestRayEls.length;
      applyActive();
    }, intervalMs);
    stopRayCycleFn = () => {
      clearInterval(timer);
      chestWrap.classList.remove('cycling');
      chestRayEls.forEach((el) => el.classList.remove('ray-active'));
      stopRayCycleFn = null;
    };
    return stopRayCycleFn;
  }

  // Fontaines actives selon le palier : follow ne montre que les 2
  // premieres (comportement d'origine), sub T1/T2/T3 debloquent les 4 -
  // dans la limite du nombre configure manuellement (SETTINGS.coinFountains,
  // deja tronque a coin_fountain_count par applySettings).
  function activeFountainsForReward(reward){
    const count = reward === 'commun'
      ? Math.min(2, SETTINGS.coinFountains.length)
      : SETTINGS.coinFountains.length;
    return SETTINGS.coinFountains.slice(0, count);
  }

  // Fontaine a pieces continue des deux cotes du coffre (voir spawnFountainCoin
  // pour la trajectoire). stopCoinFountainFn est garde au niveau module pour
  // que forceStopEverything() puisse couper une fontaine laissee en cours.
  let stopCoinFountainFn = null;
  function startCoinFountain(reward, intervalMs = 90){
    const timer = setInterval(() => {
      activeFountainsForReward(reward).forEach((fountain) => {
        spawnFountainCoin(fountain, reward);
        spawnFountainCoin(fountain, reward);
      });
    }, intervalMs);
    stopCoinFountainFn = () => {
      clearInterval(timer);
      stopCoinFountainFn = null;
    };
    return stopCoinFountainFn;
  }

  // --- Phase 2 : jaillissement decoratif d'items, cale sur ongoing-<palier>.mp3 ---
  async function playOngoing(reward, preloadedAudio){
    burstWrap.classList.add('visible');
    const stopRayCycle = startRayCycle();
    const stopCoinFountain = startCoinFountain(reward);
    const { done } = playTrack(preloadedAudio, { overlapMs: SETTINGS.ongoingEndingOverlapMs[reward] });
    const spawnTimer = setInterval(spawnFloatingIcon, 140);
    await done;
    clearInterval(spawnTimer);
    stopCoinFountain();
    // Les 3 rayons restent affiches ensemble (pas de retour a "aucun
    // rayon") pendant toute la revelation - voir playEnding.
    stopRayCycle();
  }

  // --- Phase 3 : revelation de la vraie recompense, calee sur ending-<palier>.mp3 ---
  async function playEnding(ev, reward, preloadedAudio, avatarPromise){
    const { audio, done } = playTrack(preloadedAudio, { overlapMs: SETTINGS.ongoingEndingOverlapMs[reward] });
    triggerCrowdCelebration();

    playFirework();

    const videoPath = manifest.randomVideoPath(reward);
    let usedVideo = false;
    if(videoPath){
      audio.pause(); forgetAudio(audio); // la cinematique a son propre son
      usedVideo = await tryPlayRewardVideo(videoPath);
    }else{
      // Icone de palier posee tout de suite comme filet de secours ; si
      // l'avatar du viewer est disponible (voir prefetchRewardAvatar dans
      // playChestSequence), renderRewardCardAvatar la remplace juste avant
      // de peindre la brush.
      rewardCardIcon.src = manifest.rewardIcon[reward];
      rewardCardTier.textContent = eventLabel(ev);
      rewardCardLogin.textContent = ev.twitch_login;
      await waitForRewardCardIcon();
      if(avatarPromise) await renderRewardCardAvatar(avatarPromise);
      applyRewardCardBrush(); // recadre une brush aleatoire sur la taille reelle du contenu
      rewardCard.classList.add('visible');
      await done;
    }

    // Le coffre ouvert + la recompense restent affiches jusqu'a ce que le
    // streamer clique "Fermer le coffre" - voir waitForClose/forceClose.
    await waitForClose();

    rewardCard.classList.remove('visible');
    if(usedVideo){ rewardVideo.classList.remove('visible'); rewardVideo.removeAttribute('src'); }
    burstWrap.classList.remove('visible');
    // La foule (et l'avatar de la carte) doivent disparaitre ici, a la
    // fermeture reelle - resetAvatarCrowd() n'etait sinon appele qu'au
    // debut du PROCHAIN tirage declenche (playChestSequence), jamais entre
    // temps. Comme chest-wrap redevient "visible" pour afficher un
    // eventuel prochain coffre en attente (showWaitingChest), la foule
    // laissee dans le DOM reapparaissait avec lui avant meme d'avoir ete
    // ouvert.
    resetAvatarCrowd();
    resetRewardCardAvatar();
  }

  function spawnFloatingIcon(){
    const el = document.createElement('img');
    el.className = 'floating-icon';
    const pool = manifest.decorativeIcons;
    el.src = pool[Math.floor(Math.random() * pool.length)];
    el.style.setProperty('--drift', (Math.random() * 160 - 80) + 'px');
    el.style.left = (50 + (Math.random() * 20 - 10)) + '%';
    burstWrap.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  // Horloge de danse partagee : toutes les instances d'avatar (particule de
  // fontaine ET membres de la foule) affichent le meme frame au meme
  // instant, quel que soit leur moment de creation - c'est ce qui les
  // garde synchronises entre eux.
  const DANCE_FRAME_MS = 90;
  let danceFrameIndex = 0;
  let danceTimer = null;
  const danceElements = new Set();

  function registerDanceElement(el){
    danceElements.add(el);
    el.src = manifest.avatarDanceFrames[danceFrameIndex];
    if(!danceTimer){
      danceTimer = setInterval(() => {
        danceFrameIndex = (danceFrameIndex + 1) % manifest.avatarDanceFrames.length;
        const src = manifest.avatarDanceFrames[danceFrameIndex];
        danceElements.forEach((danceEl) => { danceEl.src = src; });
      }, DANCE_FRAME_MS);
    }
  }

  function unregisterDanceElement(el){
    danceElements.delete(el);
    if(danceElements.size === 0 && danceTimer){
      clearInterval(danceTimer);
      danceTimer = null;
    }
  }

  // Ajoute un avatar permanent devant le coffre (foule qui s'accumule au
  // fil du jaillissement, palier epique). Placement aleatoire "naturel"
  // plutot qu'une grille : chaque avatar tire une profondeur (0 = fond,
  // 1 = premier plan) qui pilote a la fois sa position verticale, sa
  // taille (plus petit/loin en arriere, plus grand/proche devant) et son
  // z-index. Le z-index explicite est ce qui evite l'effet "photo de
  // famille casse" - sans lui, un avatar arrive plus tard mais assigne
  // plus en arriere se serait quand meme affiche AU-DESSUS de ceux du
  // premier plan (ordre du DOM), les faisant paraitre superposes n'importe
  // comment au lieu d'un vrai devant/derriere.
  const CROWD_SPREAD_PX = 200;
  const CROWD_BACK_TOP_PERCENT = 82;
  const CROWD_FRONT_TOP_PERCENT = 108;
  const CROWD_MIN_SIZE = 46;
  const CROWD_MAX_SIZE = 92;
  function spawnCrowdAvatar(){
    const el = document.createElement('img');
    el.className = 'avatar-crowd-member';
    const depth = Math.random(); // 0 = fond, 1 = premier plan
    const top = CROWD_BACK_TOP_PERCENT + depth * (CROWD_FRONT_TOP_PERCENT - CROWD_BACK_TOP_PERCENT);
    const baseSize = CROWD_MIN_SIZE + depth * (CROWD_MAX_SIZE - CROWD_MIN_SIZE);
    const size = Math.max(20, baseSize + (Math.random() * 14 - 7)); // variation individuelle en plus de la profondeur
    const xOffset = (Math.random() * 2 - 1) * CROWD_SPREAD_PX;
    el.style.left = `calc(50% + ${xOffset}px)`;
    el.style.top = top + '%';
    el.style.width = size + 'px';
    el.style.height = size + 'px';
    el.style.zIndex = String(Math.round(top * 10)); // devant (top eleve) au-dessus, arriere en-dessous
    avatarCrowdEl.appendChild(el);
    registerDanceElement(el);
  }

  function resetAvatarCrowd(){
    avatarCrowdEl.querySelectorAll('.avatar-crowd-member').forEach((el) => {
      unregisterDanceElement(el);
      el.remove();
    });
    crowdCount = 0;
  }

  // Remet la carte de recompense sur l'icone de palier par defaut - a
  // appeler a chaque nouveau tirage (playChestSequence) et dans
  // forceStopEverything, sinon l'avatar du tirage precedent resterait
  // affiche le temps que la nouvelle recherche Supabase reponde.
  function resetRewardCardAvatar(){
    rewardCardAvatar.innerHTML = '';
    rewardCardAvatar.classList.remove('visible');
    rewardCardIcon.style.display = '';
  }

  // Au moment de la revelation : chaque avatar quitte l'horloge de danse
  // partagee et fige sur un sprite tire au hasard, puis tous sautent
  // ensemble (meme animation .jumping declenchee au meme instant). Une
  // fois le saut termine, bascule sur un sautillement continu mais
  // asynchrone (duree/delai randomises par avatar) qui dure jusqu'a la
  // fermeture du coffre (l'element est simplement retire par
  // resetAvatarCrowd() au tirage suivant, pas besoin d'arreter quoi que ce
  // soit explicitement).
  const CROWD_JUMP_MS = 500;
  function triggerCrowdCelebration(){
    const members = [...avatarCrowdEl.querySelectorAll('.avatar-crowd-member')];
    if(members.length === 0) return;
    const frames = manifest.avatarDanceFrames;
    members.forEach((el) => {
      unregisterDanceElement(el);
      el.src = frames[Math.floor(Math.random() * frames.length)];
      el.classList.add('jumping');
    });
    setTimeout(() => {
      members.forEach((el) => {
        el.classList.remove('jumping');
        el.style.setProperty('--hop-duration', (0.45 + Math.random() * 0.35) + 's');
        el.style.setProperty('--hop-delay', (Math.random() * 0.5) + 's');
        el.classList.add('hopping');
      });
    }, CROWD_JUMP_MS);
  }

  // Chance qu'une piece de fontaine jaillisse sous forme d'avatar dansant
  // plutot qu'une piece normale - reservee au palier epique (voir
  // spawnFountainCoin). A la fin de son vol, un avatar rejoint la foule
  // devant le coffre (spawnCrowdAvatar) au lieu de simplement disparaitre.
  // Plafonnee a MAX_CROWD_SIZE : au-dela, la fontaine redevient des pieces
  // normales - sans ca, le debit tres eleve des fontaines (voir "beaucoup
  // plus de pieces") fait grossir la foule en un mur qui finit par recouvrir
  // la carte de recompense en quelques secondes. crowdCount incremente des
  // la decision (pas seulement a l'atterrissage) pour que la limite tienne
  // meme quand plusieurs avatars sont tires coup sur coup avant que le
  // premier n'ait fini son vol.
  const AVATAR_CHANCE = 0.2;
  const MAX_CROWD_SIZE = 40;
  let crowdCount = 0;

  // Piece (ou avatar, voir AVATAR_CHANCE) jaillissant d'une fontaine
  // (fountain = {x, y, arcHeightScale, arcWidthScale} en % dans .chest-wrap),
  // trajectoire parabolique resserree pres du coffre et qui s'elargit vers
  // le bas : peakX (montee, faible variance) reste proche de 0, flyX
  // (chute, forte variance 70-240px de base, mis a l'echelle par
  // arcWidthScale) fixe l'ecart final - c'est cet ecart tire au hasard par
  // piece qui cree l'evasement du jet au fil de la chute. arcHeightScale
  // met a l'echelle la hauteur de montee. Les deux sont individuels par
  // fontaine (reglables dans chest-control.html). Le sens (gauche/droite)
  // est deduit de la position x de la fontaine par rapport au centre.
  // Utilise le Web Animations API (plutot que @keyframes CSS statique) car
  // la position du pic et le debut du fondu doivent varier avec SETTINGS.
  function spawnFountainCoin(fountain, reward){
    const dir = fountain.x < 50 ? -1 : 1;
    const isAvatar = reward === 'epique' && crowdCount < MAX_CROWD_SIZE && Math.random() < AVATAR_CHANCE;
    if(isAvatar) crowdCount++; // reserve tout de suite, voir MAX_CROWD_SIZE
    const frames = isAvatar ? manifest.avatarDanceFrames : manifest.coinSpinFrames;
    let frameIdx = Math.floor(Math.random() * frames.length);

    const el = document.createElement('img');
    el.className = 'coin-fountain';
    el.style.left = fountain.x + '%';
    el.style.top = fountain.y + '%';
    el.src = frames[frameIdx];

    const baseSize = 46;
    const variation = SETTINGS.coinSizeVariation; // 0..1
    const size = Math.max(6, baseSize * (1 + (Math.random() * 2 - 1) * variation));
    el.style.width = size + 'px';
    el.style.height = size + 'px';

    const arcHeightScale = fountain.arcHeightScale ?? 1;
    const arcWidthScale = fountain.arcWidthScale ?? 1;
    const peakSpread = (8 + Math.random() * 20) * arcWidthScale;   // resserre pres du coffre
    const peakHeight = (16 + Math.random() * 30) * arcHeightScale; // montee avant la chute
    const spread = (70 + Math.random() * 170) * arcWidthScale;     // evase vers le bas
    const fallDistance = 220 + Math.random() * 180;  // 220-400px de chute
    const baseDuration = 750 + Math.random() * 400;  // 750-1150ms de vol de base
    const duration = Math.max(150, baseDuration / SETTINGS.coinSpeedScale);

    const peakX = dir * peakSpread;
    const peakY = -peakHeight;
    const flyX = dir * spread;
    const flyY = fallDistance;

    // Le pic de la parabole reste a un instant fixe du vol (35%) ; le debut
    // du fondu (coinVisibleFraction) est independant et peut tomber avant
    // ou apres selon les reglages - le tri par offset ci-dessous garantit
    // un tableau de keyframes valide dans tous les cas.
    const peakOffset = 0.35;
    const visibleOffset = Math.min(0.9, Math.max(0.13, SETTINGS.coinVisibleFraction));
    const keyframeList = [
      { offset: 0, transform: 'translate(-50%, -50%) translate(0px, 0px) scale(0.6)', opacity: 0, easing: 'ease-out' },
      { offset: 0.12, opacity: SETTINGS.coinOpacity },
      { offset: peakOffset, transform: `translate(-50%, -50%) translate(${peakX}px, ${peakY}px) scale(0.85)`, easing: 'ease-in' },
      { offset: visibleOffset, opacity: SETTINGS.coinOpacity },
      { offset: 1, transform: `translate(-50%, -50%) translate(${flyX}px, ${flyY}px) scale(1)`, opacity: 0 },
    ].sort((a, b) => a.offset - b.offset);

    chestWrap.appendChild(el);

    const anim = el.animate(keyframeList, { duration, fill: 'forwards' });

    let frameTimer = null;
    if(isAvatar){
      registerDanceElement(el);
    }else{
      const frameIntervalMs = Math.max(15, 70 / SETTINGS.coinSpriteSpeedScale);
      frameTimer = setInterval(() => {
        frameIdx = (frameIdx + 1) % frames.length;
        el.src = frames[frameIdx];
      }, frameIntervalMs);
    }

    anim.addEventListener('finish', () => {
      if(isAvatar){
        unregisterDanceElement(el);
        spawnCrowdAvatar();
      }else{
        clearInterval(frameTimer);
      }
      el.remove();
    });
  }

  // Flash blanc plein ecran a l'instant precis de l'ouverture (voir
  // .open-flash) - relance l'animation CSS meme si elle vient de jouer.
  function triggerOpenFlash(){
    openFlash.classList.remove('flash');
    void openFlash.offsetWidth;
    openFlash.classList.add('flash');
  }

  // ---------------------------- Habillage "encre" de la carte de recompense ----------------------------
  // Meme technique que twitch-chat-ink.html (brush peinte en fond, recadree
  // sur sa zone reellement encree) - voir applyRewardCardBrush.
  const REWARD_BRUSH_IMAGES = [
    'assets/brush-01.png', 'assets/brush-02.png', 'assets/brush-03.png', 'assets/brush-04.png', 'assets/brush-05.png',
    'assets/brush-06.png', 'assets/brush-07.png', 'assets/brush-08.png', 'assets/brush-09.png', 'assets/brush-10.png',
  ];
  const REWARD_BRUSH_INK_BOUNDS = {
    'assets/brush-01.png': { x0:0.034, x1:0.935, y0:0.033, y1:0.910 },
    'assets/brush-02.png': { x0:0.024, x1:0.952, y0:0.057, y1:0.932 },
    'assets/brush-03.png': { x0:0.015, x1:0.888, y0:0.073, y1:0.921 },
    'assets/brush-04.png': { x0:0.045, x1:0.952, y0:0.075, y1:0.951 },
    'assets/brush-05.png': { x0:0.011, x1:0.972, y0:0.087, y1:0.937 },
    'assets/brush-06.png': { x0:0.013, x1:0.929, y0:0.056, y1:0.888 },
    'assets/brush-07.png': { x0:0.014, x1:0.922, y0:0.098, y1:0.908 },
    'assets/brush-08.png': { x0:0.009, x1:0.901, y0:0.039, y1:0.984 },
    'assets/brush-09.png': { x0:0.055, x1:0.942, y0:0.163, y1:0.876 },
    'assets/brush-10.png': { x0:0.044, x1:0.929, y0:0.035, y1:0.855 },
  };
  const REWARD_BRUSH_PAD_X = 20, REWARD_BRUSH_PAD_Y = 14;

  // La mesure de rewardCardContent (utilisee par applyRewardCardBrush) doit
  // attendre que l'icone soit chargee, sinon sa hauteur vaut 0 et la brush
  // se recadre sur un bloc trop petit.
  function waitForRewardCardIcon(){
    if(rewardCardIcon.complete) return Promise.resolve();
    return new Promise((resolve) => {
      rewardCardIcon.addEventListener('load', resolve, { once: true });
      rewardCardIcon.addEventListener('error', resolve, { once: true });
    });
  }

  // ---------------------------- Avatar Twitch du viewer recompense ----------------------------
  // Meme systeme que twitch-chat-ink.html : avatar_customizations (edite via
  // avatar-editor.html) si ce viewer en a un, sinon un avatar fixe deduit du
  // hash de son login (stable, contrairement au display-name qui peut
  // varier en casse/unicode) - jamais les deux a la fois, et jamais rien
  // (l'icone de palier reste le filet de secours si Supabase est injoignable).
  const REWARD_AVATAR_FALLBACK_IMAGES = [
    'assets/avatar-01.png', 'assets/avatar-02.png', 'assets/avatar-03.png', 'assets/avatar-04.png',
  ];
  function pickRewardFallbackAvatar(username){
    let hash = 0;
    for(let i = 0; i < username.length; i++){
      hash = (hash * 31 + username.charCodeAt(i)) | 0;
    }
    return REWARD_AVATAR_FALLBACK_IMAGES[Math.abs(hash) % REWARD_AVATAR_FALLBACK_IMAGES.length];
  }

  function fetchRewardAvatarConfig(username){
    if(!sb) return Promise.resolve(null);
    return sb
      .from('avatar_customizations')
      .select('*')
      .eq('twitch_login', username)
      .maybeSingle()
      .then(({ data, error }) => {
        if(error){ console.error('[chest-overlay] avatar du viewer recompense:', error); return null; }
        return data || null;
      })
      .catch((err) => { console.error('[chest-overlay] avatar du viewer recompense:', err); return null; });
  }

  function waitForImages(container){
    const imgs = Array.from(container.querySelectorAll('img'));
    if(imgs.length === 0) return Promise.resolve();
    return Promise.all(imgs.map((img) => img.complete ? Promise.resolve() : new Promise((res) => {
      img.addEventListener('load', res, { once: true });
      img.addEventListener('error', res, { once: true });
    })));
  }

  // Prepare (mais n'affiche pas encore) l'avatar du viewer pour la carte de
  // recompense - a appeler des le debut de playChestSequence (le login est
  // connu tout de suite) pour que la requete Supabase ait toute la duree de
  // l'ouverture/du jaillissement pour repondre, plutot que d'ajouter un
  // temps d'attente pile au moment de la revelation.
  function prefetchRewardAvatar(username){
    return fetchRewardAvatarConfig(username).then((cfg) => ({ username, cfg }));
  }

  // Rend l'avatar (deja recupere par prefetchRewardAvatar) dans
  // rewardCardAvatar et bascule l'affichage icone de palier -> avatar.
  // Retourne une promesse resolue une fois les images chargees (mesure
  // fiable pour applyRewardCardBrush juste apres).
  async function renderRewardCardAvatar(avatarPromise){
    const { username, cfg } = await avatarPromise;
    rewardCardAvatar.innerHTML = '';
    const partsManifest = window.AVATAR_PARTS_MANIFEST;
    if(cfg && partsManifest){
      partsManifest.renderOrder.forEach((cat) => {
        const idx = cfg[cat];
        if(!idx) return;
        const img = document.createElement('img');
        img.src = partsManifest.partPath(cat, idx);
        rewardCardAvatar.appendChild(img);
      });
    }else{
      const img = document.createElement('img');
      img.src = pickRewardFallbackAvatar(username);
      rewardCardAvatar.appendChild(img);
    }
    await waitForImages(rewardCardAvatar);
    rewardCardIcon.style.display = 'none';
    rewardCardAvatar.classList.add('visible');
  }

  // Calcule un background-size/position en px tels que la zone reellement
  // encree du PNG (REWARD_BRUSH_INK_BOUNDS) recouvre exactement contentW x
  // contentH sans deborder sur le padding autour - identique a
  // brushBackgroundStyle() dans twitch-chat-ink.html.
  function rewardBrushBackgroundStyle(imgPath, contentW, contentH, padX, padY){
    const b = REWARD_BRUSH_INK_BOUNDS[imgPath];
    const boxW = contentW + padX * 2, boxH = contentH + padY * 2;
    if(!b) return { size: `${boxW}px ${boxH}px`, position: '0px 0px' };
    const wFrac = b.x1 - b.x0, hFrac = b.y1 - b.y0;
    const scaledW = contentW / wFrac, scaledH = contentH / hFrac;
    const posX = padX - b.x0 * scaledW, posY = padY - b.y0 * scaledH;
    return { size: `${scaledW.toFixed(2)}px ${scaledH.toFixed(2)}px`, position: `${posX.toFixed(2)}px ${posY.toFixed(2)}px` };
  }

  // Pose une brush aleatoire derriere le contenu de la carte, cadree sur sa
  // taille reelle (icone + texte deja rendus) - appelee juste avant
  // d'afficher la carte, une fois l'icone chargee pour ne pas mesurer un
  // bloc qui va encore bouger.
  function applyRewardCardBrush(){
    const w = rewardCardContent.offsetWidth;
    const h = rewardCardContent.offsetHeight;
    const imgPath = REWARD_BRUSH_IMAGES[Math.floor(Math.random() * REWARD_BRUSH_IMAGES.length)];
    const { size, position } = rewardBrushBackgroundStyle(imgPath, w, h, REWARD_BRUSH_PAD_X, REWARD_BRUSH_PAD_Y);
    rewardCardBrush.style.backgroundImage = `url('${imgPath}')`;
    rewardCardBrush.style.backgroundSize = size;
    rewardCardBrush.style.backgroundPosition = position;
    rewardCardBrush.style.left = -REWARD_BRUSH_PAD_X + 'px';
    rewardCardBrush.style.top = -REWARD_BRUSH_PAD_Y + 'px';
    rewardCardBrush.style.width = (w + REWARD_BRUSH_PAD_X * 2) + 'px';
    rewardCardBrush.style.height = (h + REWARD_BRUSH_PAD_Y * 2) + 'px';
  }

  // Flipbook 8 frames joue une fois en fond au moment de la revelation.
  function playFirework(){
    const frames = manifest.fireworkFrames;
    firework.classList.add('playing');
    let i = 0;
    const timer = setInterval(() => {
      firework.src = frames[i];
      i++;
      if(i >= frames.length){
        clearInterval(timer);
        firework.classList.remove('playing');
      }
    }, 70);
  }

  // Se resout quand la video se termine (ou echoue) mais NE la masque pas :
  // elle reste affichee (figee sur la derniere image) jusqu'a la fermeture
  // manuelle du coffre - voir playEnding/waitForClose.
  function tryPlayRewardVideo(src){
    return new Promise((resolve) => {
      rewardVideo.src = src;
      const onEnded = () => cleanup(true);
      const onError = () => cleanup(false);
      function cleanup(ok){
        rewardVideo.removeEventListener('ended', onEnded);
        rewardVideo.removeEventListener('error', onError);
        resolve(ok);
      }
      rewardVideo.addEventListener('ended', onEnded);
      rewardVideo.addEventListener('error', onError);
      rewardVideo.play().then(() => {
        rewardVideo.classList.add('visible');
      }).catch(() => cleanup(false));
    });
  }

  // ---------------------------- Entree des evenements ----------------------------

  // Resultat pre-determine par le serveur (Edge Function twitch-eventsub) :
  // ce mapping n'existe ici QUE pour les tests locaux (?simulate= et panneau
  // ?debug=1), jamais pour un vrai evenement (toujours ev.reward_type venant
  // de Supabase).
  const TEST_REWARD_BY_TIER = { '1000': 'rare', '2000': 'epique', '3000': 'epique' };

  function buildTestEvent(kind){
    if(kind === 'follow'){
      return { twitch_login: 'ViewerTest', event_type: 'follow', tier: null, reward_type: 'commun' };
    }
    const match = /^sub:(\d{4})$/.exec(kind || '');
    if(match){
      const tier = match[1];
      return { twitch_login: 'ViewerTest', event_type: 'subscribe', tier, reward_type: TEST_REWARD_BY_TIER[tier] || 'rare' };
    }
    return null;
  }

  // Libelle affiche sur la carte de recompense : l'evenement qui a
  // declenche le coffre ("Follow"/"Sub T1/T2/T3") plutot que la rarete du
  // palier (Commun/Rare/Epique) - ev.tier vaut '1000'/'2000'/'3000' pour un
  // sub (voir chest_events/twitch-eventsub), null pour un follow.
  const SUB_TIER_LABELS = { '1000': 'Sub T1', '2000': 'Sub T2', '3000': 'Sub T3' };
  function eventLabel(ev){
    if(ev.event_type === 'follow') return 'Follow';
    return SUB_TIER_LABELS[ev.tier] || 'Sub';
  }

  async function loadInitialPending(){
    if(!sb) return;
    const { data, error } = await sb
      .from('chest_events')
      .select('*')
      .eq('status', 'pending')
      .order('created_at', { ascending: true });
    if(error){ console.error('[chest-overlay] chargement de la file:', error); return; }
    pendingList = data || [];
    refreshWaitingDisplay();
  }

  function subscribeRealtime(){
    if(!sb) return;
    sb.channel('chest_events_overlay')
      // Nouvel evenement follow/sub : le coffre apparait et attend que le
      // streamer l'ouvre depuis chest-control.html.
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chest_events' }, (payload) => {
        pendingList.push(payload.new);
        refreshWaitingDisplay();
      })
      // Le streamer a clique "Ouvrir le coffre" : on lance l'animation.
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chest_events', filter: 'status=eq.triggered' }, (payload) => {
        pendingList = pendingList.filter((p) => p.id !== payload.new.id);
        enqueueEvent(payload.new);
      })
      // Le streamer a clique "Fermer le coffre" : on masque le coffre/la
      // recompense actuellement affiches et on enchaine sur la suite.
      .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chest_events', filter: 'status=eq.consumed' }, () => {
        forceClose();
      })
      .subscribe();
  }

  // Fige directement un etat visuel donne, sans passer par la file/les
  // pistes audio - permet de regler l'apparence (rayons, decalages...) sans
  // avoir a rejouer toute l'animation a chaque fois. Reste affiche
  // indefiniment (aucune suite programmee) jusqu'au prochain forcage ou
  // test complet. Coupe d'abord tout ce qui tournait (file, audio, boucle
  // d'attente) pour eviter qu'une animation en cours ne vienne re-changer
  // les classes juste apres.
  function forceStopEverything(){
    queue.length = 0;
    processing = false;
    animating = false;
    activeCloseResolve = null;
    if(waitingController){ waitingController.stop(); waitingController = null; }
    if(stopRayCycleFn) stopRayCycleFn();
    if(stopCoinFountainFn) stopCoinFountainFn();
    resetAvatarCrowd();
    resetRewardCardAvatar();
    activeAudios.forEach((audio) => audio.pause());
    activeAudios.clear();
  }

  function markActiveForceButton(step){
    document.querySelectorAll('#debug-force-row button').forEach((btn) => {
      btn.classList.toggle('active', btn.dataset.force === step);
    });
  }

  const FORCE_STATES = {
    idle(){
      forceStopEverything();
      chestSprite.src = manifest.chestFrames[0];
      chestWrap.classList.remove('bursting', 'pulse');
      impactFlash.classList.remove('flash');
      chestWrap.classList.add('visible', 'idle-bob');
      burstWrap.classList.remove('visible');
      rewardCard.classList.remove('visible');
      rewardVideo.classList.remove('visible');
    },
    shaking(){
      forceStopEverything();
      chestSprite.src = manifest.chestFrames[0];
      chestWrap.classList.remove('bursting', 'idle-bob');
      chestWrap.classList.add('visible', 'pulse');
      impactFlash.classList.add('flash');
      burstWrap.classList.remove('visible');
      rewardCard.classList.remove('visible');
      rewardVideo.classList.remove('visible');
    },
    bursting(){
      forceStopEverything();
      chestSprite.src = manifest.chestFrames[3];
      chestWrap.classList.remove('idle-bob', 'pulse');
      impactFlash.classList.remove('flash');
      chestWrap.classList.add('visible', 'bursting');
      burstWrap.classList.add('visible');
      rewardCard.classList.remove('visible');
      rewardVideo.classList.remove('visible');
      startRayCycle(); // meme comportement que le vrai playOngoing
      startCoinFountain('epique'); // palier le plus riche, pour previsualiser tous les effets
      triggerOpenFlash();
    },
    reveal(){
      forceStopEverything();
      const reward = 'epique';
      chestSprite.src = manifest.chestFrames[3];
      chestWrap.classList.remove('idle-bob', 'pulse');
      impactFlash.classList.remove('flash');
      chestWrap.classList.add('visible', 'bursting');
      burstWrap.classList.add('visible');
      rewardCardIcon.src = manifest.rewardIcon[reward];
      rewardCardTier.textContent = eventLabel({ event_type: 'subscribe', tier: '3000' });
      rewardCardLogin.textContent = 'ViewerTest';
      rewardVideo.classList.remove('visible');
      waitForRewardCardIcon()
        .then(() => renderRewardCardAvatar(prefetchRewardAvatar('ViewerTest')))
        .then(applyRewardCardBrush);
      rewardCard.classList.add('visible');
      // forceStopEverything() (au tout debut de cet etat) vide toujours la
      // foule - en fabrique une petite ici pour pouvoir previsualiser le
      // saut/sautillement sans avoir a chainer depuis "Jaillissement".
      if(avatarCrowdEl.children.length === 0){
        for(let i = 0; i < 18; i++) spawnCrowdAvatar();
      }
      triggerCrowdCelebration();
    },
  };

  function forceStep(step){
    FORCE_STATES[step]();
    markActiveForceButton(step);
  }

  // Panneau visible uniquement sur chest-overlay.html?debug=1 (jamais dans
  // OBS en usage normal) : boutons pour rejouer l'animation sans backend, a
  // volonte, pendant qu'on regle les timings/assets.
  function initDebugPanel(){
    const panel = document.getElementById('debug-panel');
    panel.classList.add('visible');
    panel.querySelectorAll('button[data-test]').forEach((btn) => {
      btn.addEventListener('click', () => {
        forceStopEverything();
        markActiveForceButton(null);
        const testEvent = buildTestEvent(btn.dataset.test);
        if(testEvent) enqueueEvent(testEvent);
      });
    });
    document.getElementById('debug-close-btn').addEventListener('click', forceClose);
    document.querySelectorAll('#debug-force-row button[data-force]').forEach((btn) => {
      btn.addEventListener('click', () => forceStep(btn.dataset.force));
    });
  }

  async function init(){
    const params = new URLSearchParams(location.search);

    if(params.get('debug') === '1'){
      initDebugPanel();
    }

    const simulated = buildTestEvent(params.get('simulate'));
    if(simulated){
      enqueueEvent(simulated);
      return; // mode test : pas de connexion Supabase necessaire.
    }

    await loadSettings();
    subscribeSettingsRealtime();
    await loadInitialPending(); // coffres deja en attente (ex. reload OBS en cours de stream)
    subscribeRealtime();
  }

  init();

})();
</script>
